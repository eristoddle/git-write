name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Configure Git
        run: |
          git config --global user.name "Test User"
          git config --global user.email "test@example.com"

      - name: Set up Node.js (interop tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            interop/package-lock.json
            veneer-plugin/package-lock.json

      - name: Install dependencies
        run: |
          uv sync
          npm ci --prefix interop
          npm ci --prefix veneer-plugin

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Lint
        run: uv run ruff check .

      - name: Test with pytest
        env:
          # A missing node or interop/node_modules is a failure here, not a skip.
          GITWRITE_REQUIRE_INTEROP: "1"
        run: uv run pytest --cov=gitwrite_core --cov=gitwrite_cli tests/

  plugin:
    name: plugin (veneer-plugin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veneer-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: veneer-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest on the fake host)
        run: npm test

      - name: Build
        run: npm run build
