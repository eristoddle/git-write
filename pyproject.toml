[project]
name = "gitwrite"
version = "0.1.0"
description = "Git-based version control for writers and writing teams"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "click",
    "pygit2",
    "pypandoc",
    "pyyaml",
    "rich",
]

[project.optional-dependencies]
# Server-only packages: installing the gitwrite CLI does not pull them in;
# the sync server image installs .[server].
server = [
    "dulwich",
    "waitress",
]

[project.scripts]
gitwrite = "gitwrite_cli.main:cli"
gitwrite-server = "gitwrite_server.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    # Server tests drive gitwrite_server over real HTTP, so the dev
    # environment carries the server extra; plain installs do not.
    "dulwich",
    "waitress",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitwrite_cli", "gitwrite_core", "gitwrite_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
