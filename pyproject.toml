[project]
name = "gitwrite"
version = "0.1.0"
description = "Git-based version control for writers and writing teams"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "click",
    "pygit2",
    "pypandoc",
    "pyyaml",
    "rich",
]

[project.scripts]
gitwrite = "gitwrite_cli.main:cli"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitwrite_cli", "gitwrite_core"]
